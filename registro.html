<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Cofre de Senhas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div class="shell">
    <aside class="brand-panel">
      <p class="brand-panel__label">Gerenciador de senhas</p>
      <h1 class="brand-panel__name">Cofre de Senhas</h1>
      <p class="brand-panel__copy">
        Um lugar quieto para guardar o que não deve circular.
      </p>
    </aside>

    <main class="form-panel">
      <div class="form-panel__inner">
        <header class="form-header">
          <h2 class="form-header__title">Registro</h2>
          <p class="form-header__subtitle">Digite suas credenciais mestras para registrar</p>
        </header>

        <form class="auth-form" id="form-registro" novalidate>
          <div class="field">
            <label for="usuario">Usuario</label>
            <input
              type="text"
              id="usuario"
              name="usuario"
              autocomplete="username"
              required
            />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="btn">Criar conta</button>
        </form>

        <p class="form-footer">
          Já tem conta? <a href="index.html">Entrar</a>
        </p>
      </div>
    </main>
  </div>

  <script src="assets/js/registro.js"></script>
</body>
</html>
